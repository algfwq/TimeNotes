<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wails.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TimeNotes</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('timenotes.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('theme-dark', dark);
          root.classList.toggle('theme-light', !dark);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        try {
          var dark = document.documentElement.classList.contains('dark');
          document.body.setAttribute('theme-mode', dark ? 'dark' : 'light');
          document.body.classList.toggle('semi-always-dark', dark);
          document.body.classList.toggle('semi-always-light', !dark);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
